<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#124f42">
<title>Konsultasi BEING — Dashboard Klien TEST</title>
<style>
:root{--g:#124f42;--g2:#1c6656;--soft:#f2f8f5;--line:#dbe7e1;--text:#17332b;--muted:#6b7e77;--danger:#a62e2e}
*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--text);font:15px/1.55 Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.nav{max-width:1050px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:18px}
.nav a{color:var(--g);text-decoration:none;font-weight:800}.brand{margin-right:auto;display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px;object-fit:contain}.wrap{max-width:1050px;margin:28px auto;padding:0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 5px 18px rgba(18,79,66,.05)}
.hero{background:linear-gradient(135deg,#124f42,#1d6757);color:#fff;border:0}.hero .muted{color:#d9eee7}
.kicker{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:38px;line-height:1.1;margin:8px 0 10px}h2{margin:0 0 8px}h3{margin:8px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;color:var(--text)}
.stat span{display:block;color:var(--muted);font-size:12px;font-weight:800}.stat b{font-size:28px}
.item{border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:12px}
.item-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.id{font-weight:900;color:var(--g)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}
.label{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase}.value{font-weight:700;margin-top:2px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef3f0;font-size:12px;font-weight:900}
.badge.warn{background:#fff4dc;color:#8a5a00}.badge.danger{background:#fff0f0;color:var(--danger)}.badge.ok{background:#eaf7ef;color:#237443}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
button,.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:var(--g);color:#fff}.secondary{background:#fff;color:var(--g);border:1px solid var(--g)}
button:disabled{opacity:.55;cursor:not-allowed}
.notice{padding:13px 15px;border-radius:12px;margin:12px 0}.notice.ok{background:#edf8f2;color:#17613f}.notice.error{background:#fff0f0;color:var(--danger)}
.empty,.loading{text-align:center;padding:38px;color:var(--muted)}
.hidden{display:none}.services span{display:inline-block;background:#eef5f2;border-radius:8px;padding:7px 9px;margin:3px;font-size:13px}
.paybox{margin-top:18px;padding:18px;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
.amount{font-size:28px;font-weight:900;color:var(--g)}
.field{margin-top:12px}.field label{font-weight:800}.field input[type=file],.field textarea{width:100%;margin-top:7px;border:1px solid #cbd9d2;border-radius:10px;padding:11px;font:inherit;background:#fff}
textarea{min-height:80px;resize:vertical}.row{padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
@media(max-width:700px){h1{font-size:31px}.stats,.grid{grid-template-columns:1fr}.item-head{display:block}.item-head .badge{margin-top:8px}}
</style>
</head>
<body>
<header><div class="nav">
<a class="brand" href="index.html"><img src="assets/logo-being.png" alt="BEING"><span>BEING Konsultasi</span></a>
<a href="index.html">Konsultasi</a>
</div></header>

<main class="wrap">
<section class="card hero">
<div class="kicker">KONSULTASI BEING • TEST</div>
<h1>Pengajuan Saya</h1>
<p class="muted">Pantau pengajuan, pembayaran, jadwal, psikolog, dan sesi konsultasi Anda.</p>
<div id="profile"></div>
<div class="stats">
<div class="stat"><span>Pengajuan</span><b id="countAll">-</b></div>
<div class="stat"><span>Menunggu pembayaran</span><b id="countPay">-</b></div>
<div class="stat"><span>Terjadwal</span><b id="countSchedule">-</b></div>
</div>
</section>

<div id="notice"></div>

<section class="card">
<div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
<div><h2>Daftar Konsultasi</h2><div class="muted small">Data diambil dari API Konsultasi TEST yang sama dengan proses pengajuan.</div></div>
<button class="secondary" id="refreshBtn">Refresh</button>
</div>
<div id="list" style="margin-top:14px"></div>
</section>

<section id="detailSection" class="card hidden"><div id="detail"></div></section>
</main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwHc34ZcYftGdeEYZEBTXmBWVr-9IrDmgSz8B17jIRDcBIjL8gxMIQPfvIUyOzpGuMyYg/exec';
const params = new URLSearchParams(location.search);
const state = {
  contactId: params.get("contactId") || "",
  konsultasiId: params.get("konsultasiId") || "",
  items: []
};

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function rupiah(v){
  const n=Number(v||0);
  return "Rp "+n.toLocaleString("id-ID");
}
function dateLabel(v){
  if(!v)return "-";
  const d=new Date(v);
  return isNaN(d.getTime())?esc(v):d.toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function statusBadge(s){
  s=String(s||"-").toUpperCase();
  let c="badge";
  if(["PENGAJUAN_BARU","MENUNGGU_PERSETUJUAN","MENUNGGU_PEMBAYARAN","MENUNGGU_VERIFIKASI","BELUM_DIAJUKAN"].includes(s))c+=" warn";
  if(["DITOLAK","DIBATALKAN"].includes(s))c+=" danger";
  if(["LUNAS","TERJADWAL","SELESAI"].includes(s))c+=" ok";
  return `<span class="${c}">${esc(s)}</span>`;
}

/*
 * KONTRAK API:
 * Frontend konsultasi yang berhasil menggunakan POST JSON.
 * Dashboard memakai kontrak POST yang sama, bukan GET/JSONP.
 */
async function apiPost(action,payload={}){
  const res=await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action,payload})
  });
  const text=await res.text();
  let data;
  try{data=JSON.parse(text)}catch(_){
    throw new Error("Respons API tidak valid.");
  }
  if(!res.ok)throw new Error(data.message||"Server konsultasi bermasalah.");
  return data;
}

function setNotice(msg,type="ok"){
  document.getElementById("notice").innerHTML=msg?`<div class="notice ${type}">${esc(msg)}</div>`:"";
}

function renderProfile(x){
  const p=x||{};
  document.getElementById("profile").innerHTML=
    `<div class="small" style="margin-top:12px">Halo, <b>${esc(p.nama||"Klien")}</b>${p.email?" · "+esc(p.email):""}</div>`;
}

function renderList(){
  const el=document.getElementById("list");
  if(!state.items.length){
    el.innerHTML='<div class="empty">Belum ada pengajuan konsultasi untuk akun ini.</div>';
    return;
  }
  el.innerHTML=state.items.map(x=>{
    const services=String(x.layananNama||"-").split(" | ").filter(Boolean);
    const id=String(x.konsultasiId||"");
    return `<article class="item">
      <div class="item-head">
        <div><div class="id">${esc(id)}</div><div class="muted small">${dateLabel(x.tanggalPengajuan)}</div></div>
        ${statusBadge(x.statusPengajuan)}
      </div>
      <div class="grid">
        <div><div class="label">Layanan</div><div class="value">${esc(services.join(", "))}</div></div>
        <div><div class="label">Metode</div><div class="value">${esc(x.method||"-")}</div></div>
        <div><div class="label">Pembayaran</div><div class="value">${statusBadge(x.statusPembayaran)}</div></div>
        <div><div class="label">Biaya</div><div class="value">${x.biaya?rupiah(x.biaya):"Menunggu penetapan"}</div></div>
      </div>
      <div class="actions"><button class="primary" onclick="openDetail('${esc(id)}')">Lihat Detail</button></div>
    </article>`;
  }).join("");
}

function renderStats(){
  document.getElementById("countAll").textContent=state.items.length;
  document.getElementById("countPay").textContent=state.items.filter(x=>x.statusPembayaran==="MENUNGGU_PEMBAYARAN").length;
  document.getElementById("countSchedule").textContent=state.items.filter(x=>x.statusPengajuan==="TERJADWAL").length;
}

async function load(){
  setNotice("");
  if(!state.contactId){
    document.getElementById("list").innerHTML='<div class="empty">Link akses belum memiliki ContactID. Buka dashboard dari tautan email BEING.</div>';
    return;
  }
  try{
    /*
     * Sama pola POST JSON dengan registrasi:
     * {action:"public.consultation.history",payload:{contactId}}
     */
    const r=await apiPost("public.consultation.history",{contactId:state.contactId});
    if(!r.ok)throw new Error(r.message||"Riwayat tidak dapat dimuat.");
    state.items=Array.isArray(r.items)?r.items:[];
    renderList();renderStats();
    if(state.konsultasiId)await openDetail(state.konsultasiId,false);
  }catch(e){
    setNotice(e.message||String(e),"error");
  }
}

async function openDetail(id,scroll=true){
  state.konsultasiId=id;
  document.getElementById("detailSection").classList.remove("hidden");
  document.getElementById("detail").innerHTML='<div class="loading">Memuat detail...</div>';
  try{
    const r=await apiPost("public.consultation.detail",{
      contactId:state.contactId,konsultasiId:id
    });
    if(!r.ok)throw new Error(r.message||"Detail tidak ditemukan.");
    renderDetail(r.consultation||{});
    history.replaceState(null,"",
      location.pathname+"?contactId="+encodeURIComponent(state.contactId)+"&konsultasiId="+encodeURIComponent(id)
    );
    if(scroll)document.getElementById("detailSection").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){
    document.getElementById("detail").innerHTML=`<div class="notice error">${esc(e.message||String(e))}</div>`;
  }
}

function renderDetail(c){
  const services=(c.services||[]).map(x=>`<span>${esc(x.layananNama||x.nama||"")}</span>`).join("");
  const payments=c.payments||[];
  const p=payments[0]||null;
  const sessions=c.sessions||[];
  const canPay=p && ["MENUNGGU_PEMBAYARAN","DITOLAK"].includes(String(p.status||"").toUpperCase());

  const paymentHtml=p?`
    <div class="paybox">
      <div class="kicker">PEMBAYARAN</div>
      <div class="amount">${rupiah(p.amount||c.biaya)}</div>
      <div class="grid">
        <div><div class="label">Payment ID</div><div class="value">${esc(p.paymentId||"-")}</div></div>
        <div><div class="label">Status</div><div class="value">${statusBadge(p.status)}</div></div>
      </div>
      ${canPay?`
        <div class="row"><div class="label">Bank TEST</div><div class="value">BANK BEING</div></div>
        <div class="row"><div class="label">No. Rekening TEST</div><div class="value">0000000000</div></div>
        <div class="row"><div class="label">Atas Nama TEST</div><div class="value">BEING BIRO PSIKOLOGI</div></div>
        <div class="muted small" style="margin-top:8px">Data rekening di atas hanya untuk TEST.</div>
        <div class="field">
          <label>Bukti pembayaran</label>
          <input id="proofFile" type="file" accept="image/*,.pdf">
        </div>
        <div class="field">
          <label>Catatan (opsional)</label>
          <textarea id="proofNote" placeholder="Catatan untuk admin BEING"></textarea>
        </div>
        <div class="actions">
          <button class="primary" id="sendProof" type="button">Kirim Bukti Pembayaran</button>
        </div>
        <div id="proofMsg"></div>
      `:""}
      ${p.proofUrl?`<p><a href="${esc(p.proofUrl)}" target="_blank" rel="noopener">Lihat bukti pembayaran</a></p>`:""}
    </div>`:"";

  const sessionHtml=sessions.length?sessions.map(s=>`
    <div class="item">
      <div class="item-head">
        <div><b>${esc(s.judul||"Sesi Konsultasi")}</b>
        <div class="muted small">${dateLabel(s.tanggal||s.tanggalSesi)} · ${esc(s.jam||s.jamSesi||"-")}</div></div>
        ${statusBadge(s.status)}
      </div>
      ${s.psikologNama?`<p class="small">Psikolog: <b>${esc(s.psikologNama)}</b></p>`:""}
      ${s.linkRuang?`<a class="btn primary" href="${esc(s.linkRuang)}" target="_blank" rel="noopener">Buka Ruang Konsultasi</a>`:""}
    </div>`).join(""):'<div class="muted">Belum ada sesi terjadwal.</div>';

  document.getElementById("detail").innerHTML=`
    <div class="item-head">
      <div><div class="kicker">DETAIL KONSULTASI</div><h2>${esc(c.konsultasiId||"-")}</h2></div>
      ${statusBadge(c.statusPengajuan)}
    </div>
    <div class="grid">
      <div><div class="label">Nama</div><div class="value">${esc(c.nama||"-")}</div></div>
      <div><div class="label">Metode</div><div class="value">${esc(c.method||c.tipeLayanan||"-")}</div></div>
      <div><div class="label">Status Pembayaran</div><div class="value">${statusBadge(c.statusPembayaran)}</div></div>
      <div><div class="label">Biaya</div><div class="value">${c.biaya?rupiah(c.biaya):"Menunggu penetapan"}</div></div>
    </div>
    <div style="margin-top:16px"><div class="label">LAYANAN</div><div class="services" style="margin-top:6px">${services||"-"}</div></div>
    ${c.psikologNama?`<div class="row" style="margin-top:14px"><div class="label">PSIKOLOG</div><div class="value">${esc(c.psikologNama)}</div></div>`:""}
    ${paymentHtml}
    <div style="margin-top:24px"><div class="kicker">JADWAL & SESI</div><h3>Perjalanan konsultasi</h3>${sessionHtml}</div>
  `;

  if(canPay)document.getElementById("sendProof").onclick=submitProof;
}

async function submitProof(){
  const file=document.getElementById("proofFile")?.files?.[0];
  const msg=document.getElementById("proofMsg");
  const btn=document.getElementById("sendProof");
  if(!file){msg.innerHTML='<div class="notice error">Pilih bukti pembayaran terlebih dahulu.</div>';return;}
  if(file.size>2*1024*1024){msg.innerHTML='<div class="notice error">Ukuran bukti maksimal 2 MB.</div>';return;}

  btn.disabled=true;btn.textContent="Mengirim...";
  try{
    const reader=new FileReader();
    const data=await new Promise((resolve,reject)=>{
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>reject(new Error("File tidak dapat dibaca."));
      reader.readAsDataURL(file);
    });

    const r=await apiPost("public.consultation.paymentProof",{
      contactId:state.contactId,
      konsultasiId:state.konsultasiId,
      paymentId:(document.querySelector(".paybox .value")?.textContent||"").trim(),
      fileName:file.name,
      mimeType:file.type,
      fileData:data,
      catatan:document.getElementById("proofNote")?.value||""
    });
    if(!r.ok)throw new Error(r.message||"Bukti pembayaran gagal dikirim.");

    msg.innerHTML='<div class="notice ok">'+esc(r.message||"Bukti pembayaran berhasil dikirim.")+'</div>';
    await load();
    await openDetail(state.konsultasiId,false);
  }catch(e){
    msg.innerHTML='<div class="notice error">'+esc(e.message||String(e))+'</div>';
    btn.disabled=false;btn.textContent="Kirim Bukti Pembayaran";
  }
}

document.getElementById("refreshBtn").onclick=load;
load();
</script>
</body>
</html>
